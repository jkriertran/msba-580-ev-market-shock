name: Validate Shiny project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::jsonlite
            any::shiny
            any::ggplot2
            any::plotly
            any::scales
      - name: Rebuild Washington analysis
        run: Rscript scripts/run_washington_analysis.R
      - name: Rebuild conjoint analysis
        run: Rscript scripts/run_conjoint_analysis.R
      - name: Parse app and validate data contracts
        run: Rscript scripts/validate_project.R
