name: Validate Shiny project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Rebuild descriptive analysis
        run: Rscript scripts/run_descriptive_analysis.R
      - name: Rebuild conjoint analysis
        run: Rscript scripts/run_conjoint_analysis.R
      - name: Parse app and validate data contracts
        run: Rscript scripts/validate_project.R
